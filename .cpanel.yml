---
# ==============================================================================
# cPanel Git Versioning Auto-Deployment Configuration
# Docs: https://docs.cpanel.net/cpanel/git-versioning/guide-to-git-cpanel-yml/
# ==============================================================================
deployment:
  tasks:
    - |
      set -e
      TARGET=""
      if [ -d "/home/$USER/interior.ritiverse.in" ]; then
        TARGET="/home/$USER/interior.ritiverse.in"
      elif [ -d "/home/$USER/public_html/interior" ]; then
        TARGET="/home/$USER/public_html/interior"
      elif [ -d "/home/$USER/public_html" ]; then
        TARGET="/home/$USER/public_html"
      else
        TARGET="."
      fi
      echo "=== Deploying Atelier Vérité to: $TARGET ==="

      # 1. Ensure required directories exist
      /bin/mkdir -p "$TARGET/uploads/projects" "$TARGET/uploads/gallery" "$TARGET/uploads/before-after" "$TARGET/uploads/brand" "$TARGET/uploads/press"

      # 2. Deploy React compiled production files directly to web root
      if [ -d "dist" ]; then
        echo "Copying compiled production assets from dist/ to $TARGET/..."
        /bin/cp -Rf dist/* "$TARGET/"
      fi

      # 3. Deploy PHP REST API and Admin CMS
      if [ -d "api" ]; then
        echo "Deploying /api backend..."
        /bin/cp -Rf api "$TARGET/"
      fi

      # 4. Deploy Apache configurations
      if [ -f ".htaccess" ]; then
        /bin/cp -f .htaccess "$TARGET/.htaccess"
      fi
      if [ -f "uploads/.htaccess" ]; then
        /bin/cp -f uploads/.htaccess "$TARGET/uploads/.htaccess"
      fi

      # 5. Preserve production .env if not yet created on server
      if [ ! -f "$TARGET/.env" ] && [ -f ".env.example" ]; then
        /bin/cp .env.example "$TARGET/.env"
      fi

      # 6. Set secure file and directory permissions
      /bin/chmod -R 755 "$TARGET/uploads"
      echo "=== Deployment completed successfully ==="
