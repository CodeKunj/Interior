---
# ==============================================================================
# cPanel Git Versioning Auto-Deployment Configuration
# Docs: https://docs.cpanel.net/cpanel/git-versioning/guide-to-git-cpanel-yml/
# ==============================================================================
deployment:
  tasks:
    # 1. Determine target directory for interior.ritiverse.in or primary domain
    - |
      if [ -d "/home/$USER/interior.ritiverse.in" ]; then
        export DEPLOYPATH="/home/$USER/interior.ritiverse.in"
      elif [ -d "/home/$USER/public_html/interior" ]; then
        export DEPLOYPATH="/home/$USER/public_html/interior"
      else
        export DEPLOYPATH="/home/$USER/public_html"
      fi
      echo "Deploying to: $DEPLOYPATH"

    # 2. Ensure media and destination folders exist
    - /bin/mkdir -p $DEPLOYPATH/uploads/projects
    - /bin/mkdir -p $DEPLOYPATH/uploads/gallery
    - /bin/mkdir -p $DEPLOYPATH/uploads/before-after

    # 3. Deploy React production build (index.html & assets/)
    - /bin/cp -R dist/* $DEPLOYPATH/

    # 4. Deploy PHP 8+ REST API backend & Studio CMS (/api)
    - /bin/cp -R api $DEPLOYPATH/

    # 5. Deploy root Apache rewrite & security rules (.htaccess)
    - /bin/cp .htaccess $DEPLOYPATH/.htaccess

    # 6. Deploy upload security shield (.htaccess inside uploads/)
    - /bin/cp uploads/.htaccess $DEPLOYPATH/uploads/.htaccess

    # 7. Preserve .env if not yet created on server
    - if [ ! -f $DEPLOYPATH/.env ] && [ -f .env.example ]; then /bin/cp .env.example $DEPLOYPATH/.env; fi

    # 8. Set correct directory permissions (chmod 755 for uploads)
    - /bin/chmod -R 755 $DEPLOYPATH/uploads
